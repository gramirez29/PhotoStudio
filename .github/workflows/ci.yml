name: CI

# Builds and tests the three projects. It runs on every pull request, and the deploy workflows call it first, so nothing is
# deployed that did not pass. The actions are pinned to a commit (the comment says which version) because the repository is public.
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: backend/global.json

      # The integration tests need a MongoDB replica set (transactions), exactly like production. The compose file starts one
      # on 127.0.0.1:27019, the address the tests use by default. It does not rely on `--wait`: a runner image update made Compose
      # report the container as unhealthy half a second after starting it. Instead the step initiates the replica set itself and
      # polls until a primary is elected (up to 2 minutes), failing early if the container stops.
      - name: Start MongoDB
        working-directory: backend
        run: |
          docker compose up -d mongo
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Running}}' photostudio-mongo)" != "true" ]; then
              echo "The MongoDB container stopped."
              exit 1
            fi
            if docker exec photostudio-mongo mongosh --quiet --eval "try { rs.status().myState === 1 ? quit(0) : quit(1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); quit(1) }"; then
              echo "MongoDB primary elected after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not elect a primary in time."
          exit 1

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build (warnings are errors)
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: backend
        run: dotnet test --no-build --configuration Release

      # Shows why MongoDB did not start, or what it logged during a failed run; it does not run when the job succeeds.
      - name: MongoDB diagnostics
        if: failure()
        working-directory: backend
        run: |
          docker compose ps --all
          docker inspect --format '{{json .State}}' photostudio-mongo || true
          docker logs --tail 100 photostudio-mongo || true

  image:
    name: Backend (production image builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Railway builds this same Dockerfile, so a broken image should fail here and not in the middle of a deploy.
      - name: Build the image
        run: docker build --tag photostudio-api:ci backend

  mobile:
    name: Mobile (types, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run verify

  portal:
    name: Portal (types, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci
      - run: npm run verify
      - run: npm run build
